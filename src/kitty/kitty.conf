font_family             DroidSansMNerdFontMono
font_size               14.0

background              #1e1e2e
foreground              #cdd6f4
background_opacity      0.95

selection_background    #f2cdcd
selection_foreground    #04060b

tab_bar_edge            top
tab_bar_style           powerline

# Active tab: blue background, green top border, dark text
active_tab_background   #2f303f
active_tab_foreground   #bac3df
active_tab_border_color #00ff99

# Inactive tab: dark background, bright text, "invisible" border
inactive_tab_background #1e1e2e
inactive_tab_foreground #91939d
inactive_tab_border_color #1e1e2e

# key bindings
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map f2 set_tab_title

color0   #1e2030
color8   #444a73

color1   #ff757f
color9   #ff757f

color2   #c3e88d
color10  #c3e88d

color3   #ffc777
color11  #ffc777

color4   #82aaff
color12  #82aaff

color5   #c099ff
color13  #c099ff

color6   #86e1fc
color14  #86e1fc

color7   #c8d3f5
color15  #c8d3f5
