font_family             DroidSansMNerdFontMono
font_size               12.0

# Prevent title bar in GNOME
hide_window_decorations yes
window_border_width     0
draw_minimal_borders    yes

background              #1e1e1e
foreground              #eeeeec
background_opacity      0.9

selection_background    #f2cdcd
selection_foreground    #04060b

tab_bar_edge            top
tab_bar_style           powerline
tab_bar_background      #313244
active_tab_background   #a6adc8
active_tab_foreground   #313244
inactive_tab_background #585b70
inactive_tab_foreground #cdd4f4

map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map f2 set_tab_title

color0   #1e2030
color8   #444a73

color1   #ff757f
color9   #ff757f

color2   #c3e88d
color10  #c3e88d

color3   #ffc777
color11  #ffc777

color4   #82aaff
color12  #82aaff

color5   #c099ff
color13  #c099ff

color6   #86e1fc
color14  #86e1fc

color7   #c8d3f5
color15  #c8d3f5
