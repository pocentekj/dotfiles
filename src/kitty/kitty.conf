allow_remote_control    yes

font_family             DroidSansMNerdFontMono
font_size               12.0

# Prevent title bar in GNOME
hide_window_decorations yes
window_border_width     0
draw_minimal_borders    yes

# Adwaita-dark base
background              #1e1e1e
foreground              #eeeeec
background_opacity      0.9

# Selection (Adwaita blue selection on dark)
selection_background    #3584e4
selection_foreground    #ffffff

# Tabs (subtle dark surfaces + Adwaita accent on active)
tab_bar_edge            top
tab_bar_style           powerline
tab_bar_background      #2a2a2a
active_tab_background   #3584e4
active_tab_foreground   #ffffff
inactive_tab_background #2a2a2a
inactive_tab_foreground #deddda

map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map shift+f2 set_tab_title

# ANSI 16-color palette mapped to Adwaita hues
# (regular → bright)
color0   #1e1e1e
color8   #4f4f4f

color1   #e01b24
color9   #f66151

color2   #33d17a
color10  #57e389

color3   #f6d32d
color11  #f9f06b

color4   #3584e4
color12  #62a0ea

color5   #9141ac
color13  #dc8add

color6   #2aa1ae
color14  #8cd5e5

color7   #deddda
color15  #eeeeec
