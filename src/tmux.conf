# Set prefix to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Prevent scrolling after copy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection

# Improve colors
set -g default-terminal "tmux-256color"

# Fixes overlapping themes for Neovim, when opened in Tmux
set-option -ga terminal-overrides ",*:Tc"

# Window/Pane indexing starts from 1
set -g base-index 1
setw -g pane-base-index 1

# Pane navigation using leader key + h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Aliases
set -s command-alias[10] ks="kill-session"
set -s command-alias[11] rpu="resize-pane -U"
set -s command-alias[12] rpd="resize-pane -D"
set -s command-alias[13] rpl="resize-pane -L"
set -s command-alias[14] rpr="resize-pane -R"

# Fix for VIM delay
set -sg escape-time 10

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Dracula plugin settings
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon "#h"
set -g @dracula-plugins "ram-usage cpu-usage time"

# tmux-resurrect
set -g @resurrect-strategy-nvim 'session' # try to store Nvim session

# Initialize TMUX plugin manager (keep this at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
